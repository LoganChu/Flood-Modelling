[package]
version      = "1.0.0"
name         = "drifter_vis"
title        = "River Drifter Visualisation"
description  = "Kinematic replay and Newton validation of a GPS/IMU river drifter in Isaac Sim"
category     = "Simulation"
keywords     = ["hydrology", "river", "drifter", "GPS", "visualization", "cesium"]

# Author / contact
[package.writeTarget]
kit = true

[dependencies]
"omni.kit.uiapp"          = {}
"omni.usd"                = {}
"omni.timeline"           = {}
"omni.physx"              = {}
# Debug draw is optional for Isaac Sim 5.1 — gracefully disabled if unavailable
# "omni.isaac.debug_draw"   = {}

# Cesium is optional — the extension falls back gracefully if absent
# "cesium.omniverse"      = {}

[python]
path = "."

[[python.module]]
name = "src"

[settings]
# Default CSV path relative to the repo root (overridden via UI file picker)
exts.default_csv = "data/enoFeb16th_smoothed.csv"
exts.fps          = 24.0
exts.prebake_mode = true
